# À chaque push sur main : build de l'image du front et push sur ghcr.io
name: ci-cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./front-index
          push: true
          tags: |
            ghcr.io/loic-only-one/videotheque-front-index:${{ github.sha }}
            ghcr.io/loic-only-one/videotheque-front-index:latest
